<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse tasks – SkyNetworks</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1a3a;--blue:#2563eb;--blue-soft:#e8f0fe;--line:#e3e8f2;--bg:#f4f7fc;--muted:#66718a;--white:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--white);border-bottom:1px solid var(--line)}
header a{color:var(--ink);text-decoration:none;font-size:14px}
header .brand{font-weight:700;font-size:18px}
header .brand span{color:var(--blue)}
header .post{margin-left:auto;background:var(--blue);color:#fff;padding:9px 14px;border-radius:8px;font-weight:500}
.filters{display:flex;gap:8px;padding:10px 16px;background:var(--white);border-bottom:1px solid var(--line);overflow-x:auto;align-items:center}
.filters select,.filters input{font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--white);color:var(--ink);min-width:0}
.filters input[type=text]{width:170px}
.filters label{font-size:14px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.filters button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--white);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.filters button:focus-visible,.filters select:focus-visible,.filters input:focus-visible,.card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tabs{display:none}
main{flex:1;display:grid;grid-template-columns:minmax(340px,430px) 1fr;min-height:0}
#list{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
#map{height:100%;width:100%}
.count{font-size:13px;color:var(--muted);padding:2px 4px}
.card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.card:hover{border-color:#b9c7e6}
.card.active{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.card h3{margin:0;font-size:16px;font-weight:500;line-height:1.3}
.card .price{font-weight:700;font-size:17px}
.meta{grid-column:1/2;display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.meta div{display:flex;gap:7px;align-items:center}
.meta svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.side{grid-column:2/3;grid-row:2/4;align-self:end;justify-self:end;width:40px;height:40px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700}
.foot{grid-column:1/3;display:flex;gap:8px;align-items:center;font-size:13px}
.open{color:var(--blue);font-weight:700}
.assigned{color:var(--muted);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
.pin{background:var(--white);color:var(--ink);border:2px solid var(--blue);border-radius:999px;padding:3px 9px;font:700 12px 'DM Sans',sans-serif;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25);transform:translate(-50%,-50%)}
.pin.on{background:var(--blue);color:#fff;z-index:999!important}
.pin.done{border-color:#9aa6bd;color:#66718a}
@media (max-width:820px){
  main{grid-template-columns:1fr}
  .tabs{display:flex;margin-left:auto;gap:0}
  .tabs button{border-radius:0}
  .tabs button:first-child{border-radius:999px 0 0 999px}
  .tabs button:last-child{border-radius:0 999px 999px 0}
  .tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  #list,#map{display:none}
  main.show-list #list{display:flex}
  main.show-map #map{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <a class="brand" href="index.html">Sky<span>Networks</span></a>
  <a href="index.html">Home</a>
  <a href="browse-tasks.html">Browse tasks</a>
  <a class="post" href="index.html#post-task">Post a task</a>
</header>

<div class="filters" role="search">
  <select id="fCat" aria-label="Category">
    <option value="">All categories</option>
    <option>Home &amp; repairs</option>
    <option>Digital</option>
    <option>Delivery &amp; errands</option>
    <option>Events</option>
    <option>Tutoring</option>
  </select>
  <input id="fTown" type="text" list="towns" placeholder="Town, e.g. Eldoret" aria-label="Town">
  <datalist id="towns"></datalist>
  <select id="fRadius" aria-label="Distance">
    <option value="0">Any distance</option>
    <option value="5">5 km</option>
    <option value="10">10 km</option>
    <option value="25">25 km</option>
    <option value="50">50 km</option>
    <option value="100">100 km</option>
  </select>
  <select id="fPrice" aria-label="Price">
    <option value="0-99999999">Any price</option>
    <option value="0-1000">Under KSh 1,000</option>
    <option value="1000-5000">KSh 1,000 – 5,000</option>
    <option value="5000-20000">KSh 5,000 – 20,000</option>
    <option value="20000-99999999">KSh 20,000+</option>
  </select>
  <select id="fSort" aria-label="Sort">
    <option value="new">Newest</option>
    <option value="high">Highest price</option>
    <option value="low">Lowest price</option>
  </select>
  <label><input id="fOpen" type="checkbox" checked> Open only</label>
  <button id="fClear" type="button">Clear</button>
  <div class="tabs">
    <button id="tList" type="button" class="on">List</button>
    <button id="tMap" type="button">Map</button>
  </div>
</div>

<main class="show-list" id="main">
  <section id="list" aria-live="polite"></section>
  <div id="map" aria-label="Task map"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== 1. SETTINGS – paste your own values ======
const SUPABASE_URL = 'YOUR_SUPABASE_URL';        // e.g. https://abcd1234.supabase.co
const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';   // the public "anon" key, never the service key
const TASK_PAGE = 'task.html?id=';               // page that shows one task (change to yours)

// Approximate centre points for towns (used when a task has no lat/lng).
const TOWNS = {
  'Nairobi':[-1.286,36.817],'Eldoret':[0.514,35.27],'Mombasa':[-4.043,39.668],
  'Kisumu':[-0.092,34.768],'Nakuru':[-0.303,36.08],'Thika':[-1.033,37.069],
  'Nyeri':[-0.42,36.947],'Machakos':[-1.517,37.263],'Kakamega':[0.283,34.752],
  'Naivasha':[-0.717,36.431],'Kisii':[-0.682,34.767],'Meru':[0.047,37.649]
};

// Sample tasks shown only until you add your Supabase keys.
const DEMO = [
  {id:1,title:'Move me to a new house',category:'Delivery & errands',budget:2000,area_name:'Eldoret',status:'open',created_at:'2026-11-02',offers:2},
  {id:2,title:'Fix leaking kitchen tap',category:'Home & repairs',budget:1500,area_name:'Nairobi',status:'open',created_at:'2026-11-01',offers:5},
  {id:3,title:'Design a logo for my shop',category:'Digital',budget:6000,area_name:'Kisumu',status:'assigned',created_at:'2026-10-30',offers:9},
  {id:4,title:'Maths tutor for Form 3',category:'Tutoring',budget:3500,area_name:'Nakuru',status:'open',created_at:'2026-10-29',offers:1},
  {id:5,title:'Set up chairs for a wedding',category:'Events',budget:8000,area_name:'Mombasa',status:'open',created_at:'2026-10-28',offers:0}
];

// ====== 2. MAP ======
const map = L.map('map').setView([0.5, 37.5], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 18
}).addTo(map);
const markers = {};
let layer = L.layerGroup().addTo(map);

// ====== 3. HELPERS ======
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => 'KSh ' + Number(n || 0).toLocaleString('en-KE');
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB', {day:'numeric', month:'short'}) : '';
const km = (a, b) => {
  const r = x => x * Math.PI / 180, R = 6371;
  const dLat = r(b[0]-a[0]), dLng = r(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
const townCoords = name => {
  if (!name) return null;
  const key = Object.keys(TOWNS).find(t => name.toLowerCase().includes(t.toLowerCase()));
  return key ? TOWNS[key] : null;
};
const icon = {
  pin:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};
$('towns').innerHTML = Object.keys(TOWNS).map(t => `<option value="${t}">`).join('');

// ====== 4. LOAD TASKS ======
let ALL = [];
async function load() {
  let rows;
  if (SUPABASE_URL.startsWith('YOUR_')) {
    rows = DEMO;
  } else {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    // Try with offer counts first; fall back if you have no "offers" table yet.
    let res = await sb.from('tasks').select('*, offers(count)').order('created_at', {ascending:false});
    if (res.error) res = await sb.from('tasks').select('*').order('created_at', {ascending:false});
    if (res.error) {
      $('list').innerHTML = '<div class="empty">Could not load tasks: ' + esc(res.error.message) + '</div>';
      return;
    }
    rows = res.data;
  }
  ALL = rows.map(r => ({
    id: r.id,
    title: r.title,
    category: r.category,
    budget: r.budget,
    area: r.area_name,
    status: (r.status || 'open').toLowerCase(),
    created: r.created_at,
    due: r.due_date || null,
    offers: r.offers && r.offers[0] ? r.offers[0].count : (typeof r.offers === 'number' ? r.offers : 0),
    coords: (r.lat != null && r.lng != null) ? [Number(r.lat), Number(r.lng)] : townCoords(r.area_name)
  }));
  render(true);
}

// ====== 5. FILTER + RENDER ======
function filtered() {
  const cat = $('fCat').value, town = $('fTown').value.trim().toLowerCase();
  const [pMin, pMax] = $('fPrice').value.split('-').map(Number);
  const radius = Number($('fRadius').value), centre = townCoords($('fTown').value);
  let out = ALL.filter(t =>
    (!cat || t.category === cat) &&
    (!$('fOpen').checked || t.status === 'open') &&
    t.budget >= pMin && t.budget <= pMax
  );
  if (town) {
    out = out.filter(t => {
      if (radius && centre && t.coords) return km(centre, t.coords) <= radius;
      return (t.area || '').toLowerCase().includes(town);
    });
  }
  const s = $('fSort').value;
  out.sort((a, b) => s === 'high' ? b.budget - a.budget : s === 'low' ? a.budget - b.budget : new Date(b.created) - new Date(a.created));
  return out;
}

function render(fit) {
  const tasks = filtered();
  const list = $('list');
  layer.clearLayers();
  Object.keys(markers).forEach(k => delete markers[k]);

  if (!tasks.length) {
    list.innerHTML = '<div class="empty">No tasks match these filters.<br>Try a wider distance or clear the filters.</div>';
    return;
  }
  list.innerHTML = '<div class="count">' + tasks.length + ' task' + (tasks.length === 1 ? '' : 's') + '</div>' + tasks.map(t => `
    <article class="card" tabindex="0" data-id="${esc(t.id)}">
      <h3>${esc(t.title)}</h3>
      <div class="price">${money(t.budget)}</div>
      <div class="meta">
        <div>${icon.pin}<span>${esc(t.area || 'Area not specified')}</span></div>
        <div>${icon.cal}<span>${t.due ? 'Before ' + fmtDate(t.due) : 'Flexible'}</span></div>
        <div>${icon.clock}<span>Posted ${fmtDate(t.created)}</span></div>
      </div>
      <div class="side">${esc((t.title || '?')[0].toUpperCase())}</div>
      <div class="foot">
        <span class="${t.status === 'open' ? 'open' : 'assigned'}">${t.status === 'open' ? 'Open' : 'Assigned'}</span>
        ${t.offers ? '<span>' + t.offers + (t.offers === 1 ? ' offer' : ' offers') + '</span>' : ''}
      </div>
    </article>`).join('');

  const pts = [];
  tasks.forEach(t => {
    if (!t.coords) return;
    pts.push(t.coords);
    const m = L.marker(t.coords, {
      icon: L.divIcon({className:'', html:`<div class="pin ${t.status === 'open' ? '' : 'done'}">${money(t.budget)}</div>`, iconSize:[0,0]})
    }).addTo(layer);
    m.on('click', () => select(t.id, true));
    markers[t.id] = m;
  });
  if (fit && pts.length) map.fitBounds(pts, {padding:[40,40], maxZoom:12});
}

function select(id, scroll) {
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', c.dataset.id == id));
  document.querySelectorAll('.pin').forEach(p => p.classList.remove('on'));
  const m = markers[id];
  if (m) {
    m.getElement().querySelector('.pin').classList.add('on');
    map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 11), {duration: .6});
  }
  if (scroll) {
    const card = document.querySelector('.card[data-id="' + id + '"]');
    if (card) card.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
}

// ====== 6. EVENTS ======
$('list').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  if (c.classList.contains('active')) { location.href = TASK_PAGE + encodeURIComponent(c.dataset.id); return; }
  select(c.dataset.id, false);
});
$('list').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('card')) location.href = TASK_PAGE + encodeURIComponent(e.target.dataset.id);
});
['fCat','fTown','fRadius','fPrice','fSort','fOpen'].forEach(id => $(id).addEventListener('input', () => render(true)));
$('fClear').addEventListener('click', () => {
  $('fCat').value = ''; $('fTown').value = ''; $('fRadius').value = '0';
  $('fPrice').selectedIndex = 0; $('fSort').value = 'new'; $('fOpen').checked = true;
  render(true);
});
function tab(which) {
  $('main').className = 'show-' + which;
  $('tList').classList.toggle('on', which === 'list');
  $('tMap').classList.toggle('on', which === 'map');
  if (which === 'map') setTimeout(() => map.invalidateSize(), 50);
}
$('tList').onclick = () => tab('list');
$('tMap').onclick = () => tab('map');

load();
</script>
</body>
</html>
